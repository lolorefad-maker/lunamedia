# بيبني ملف APK مع كل push، وبيحطه بصفحة Releases (apk-latest) وبـ Actions → Artifacts.
# عنوان السيرفر: Settings → Secrets and variables → Actions → Variables → API_BASE
name: Android APK

on:
  push:
    branches: [main]
    paths:
      - "public/**"
      - "assets/**"
      - "capacitor.config.json"
      - "package.json"
      - "package-lock.json"
      - "ci/**"
      - ".github/workflows/android.yml"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21

      - uses: android-actions/setup-android@v3

      - run: npm ci

      - name: Point the app at the Render server
        run: echo "window.APP_CONFIG = { apiBase: '${{ vars.API_BASE || 'https://zarqa-leads.onrender.com' }}' };" > public/config.js

      - name: Create Android project + icons
        run: |
          npx cap add android
          npx capacitor-assets generate --android

      - name: Use the repo signing key (so updates install over the old app)
        run: |
          mkdir -p ~/.android
          cp ci/debug.keystore ~/.android/debug.keystore

      - name: Build APK
        run: |
          cd android
          chmod +x gradlew
          ./gradlew assembleDebug --no-daemon
          cp app/build/outputs/apk/debug/app-debug.apk ../zarqa-leads.apk

      - uses: actions/upload-artifact@v4
        with:
          name: zarqa-leads-apk
          path: zarqa-leads.apk

      - name: Publish to the apk-latest release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: apk-latest
          name: لوحة العملاء — آخر نسخة APK
          body: نزّل zarqa-leads.apk على موبايلك وثبّته (فعّل التثبيت من مصادر غير معروفة).
          prerelease: true
          files: zarqa-leads.apk
