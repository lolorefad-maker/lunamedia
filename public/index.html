<!doctype html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#779A7E">
  <title>لوحة العملاء</title>
  <link rel="icon" href="icons/icon-192.png">
  <link rel="apple-touch-icon" href="icons/icon-192.png">
  <link rel="manifest" href="manifest.webmanifest">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans+Arabic:wght@400;500;600;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="styles.css">
</head>
<body>
  <div class="login" id="login" hidden>
    <form class="login-card" id="login-form" autocomplete="on">
      <span class="brand-mark login-mark" data-icon="home"></span>
      <h1>لوحة العملاء</h1>
      <p class="login-sub">ادخل كلمة السر عشان تفتح بياناتك</p>
      <div class="field" id="server-field" hidden>
        <label for="login-server">عنوان السيرفر</label>
        <input class="input ltr" id="login-server" type="url" inputmode="url" placeholder="https://zarqa-leads.onrender.com" autocomplete="url">
      </div>
      <div class="field">
        <label for="login-user">اسمك</label>
        <input class="input" id="login-user" autocomplete="nickname" placeholder="بيظهر بالتقارير: مين اتصل ومين سكّر">
      </div>
      <div class="field">
        <label for="login-pass">كلمة السر</label>
        <input class="input" id="login-pass" type="password" autocomplete="current-password" required>
      </div>
      <button class="btn btn-primary btn-lg" type="submit" id="login-btn">دخول</button>
      <p class="hint login-msg" id="login-msg" role="status" aria-live="polite"></p>
    </form>
  </div>

  <div class="app" hidden>
    <aside class="sidebar">
      <div class="brand">
        <span class="brand-mark" data-icon="home"></span>
        <span class="brand-name">لوحة العملاء</span>
      </div>
      <nav class="nav" id="nav">
        <a href="#overview" data-view="overview" data-admin><span data-icon="grid"></span>لوحة التحكم</a>
        <a href="#leads" data-view="leads" data-admin><span data-icon="users"></span>العملاء المحتملين</a>
        <a href="#pipeline" data-view="pipeline" data-admin><span data-icon="columns"></span>المتابعة<b class="nav-badge" id="badge-due" hidden></b></a>
        <a href="#inventory" data-view="inventory" data-admin><span data-icon="clipboard"></span>الجرد والأرقام</a>
        <a href="#report" data-view="report"><span data-icon="chart"></span>تقرير الإدارة</a>
        <a href="#assistant" data-view="assistant" data-admin><span data-icon="sparkles"></span>المساعد الذكي</a>
      </nav>
      <div class="side-card">
        <span class="side-card-icon" data-icon="shield"></span>
        <h4>المزامنة</h4>
        <p id="sync-status">...</p>
        <button class="btn btn-soft" data-action="sync-now">زامن هسا</button>
      </div>
      <a class="nav-settings" href="#settings" data-view="settings" data-admin><span data-icon="settings"></span>الإعدادات</a>
    </aside>

    <main class="main" id="main"></main>

    <!-- موبايل: شريط تنقل تحت -->
    <nav class="tabbar" aria-label="التنقل">
      <a href="#overview" data-view="overview"><span data-icon="grid"></span><b>الرئيسية</b></a>
      <a href="#leads" data-view="leads"><span data-icon="users"></span><b>العملاء</b></a>
      <a href="#pipeline" data-view="pipeline"><span data-icon="columns"></span><b>المتابعة</b><i class="tab-badge" id="badge-due-2" hidden></i></a>
      <a href="#assistant" data-view="assistant"><span data-icon="sparkles"></span><b>المساعد</b></a>
      <button type="button" data-action="more" class="tab-more"><span data-icon="dots"></span><b>المزيد</b></button>
    </nav>
    <div class="more-backdrop" id="more-backdrop" hidden></div>
    <div class="more-sheet" id="more-sheet" hidden>
      <span class="sheet-grip"></span>
      <a href="#inventory" data-view="inventory"><span data-icon="clipboard"></span>الجرد والأرقام</a>
      <a href="#report" data-view="report"><span data-icon="chart"></span>تقرير الإدارة</a>
      <a href="#settings" data-view="settings"><span data-icon="settings"></span>الإعدادات</a>
      <div class="sheet-sync"><span data-icon="shield"></span><span id="sync-status-3">...</span><button class="btn btn-soft btn-sm" data-action="sync-now">زامن هسا</button></div>
    </div>
  </div>

  <div class="drawer-backdrop" id="drawer-backdrop" hidden></div>
  <aside class="drawer" id="drawer" aria-hidden="true"></aside>

  <div class="modal-backdrop" id="modal" hidden></div>
  <div class="toast" id="toast" role="status" aria-live="polite"></div>
  <div class="tip" id="tip" role="tooltip"></div>

  <script src="https://cdnjs.cloudflare.com/ajax/libs/xlsx/0.18.5/xlsx.full.min.js" defer></script>
  <script src="config.js"></script>
  <script src="merge.js"></script>
  <script src="app.js" defer></script>
</body>
</html>
